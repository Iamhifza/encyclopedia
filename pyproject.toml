[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-computing-encyclopedia"
version = "0.1.0"
description = "Tooling for the AI & Computing Encyclopedia: validate, build and query the concept corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The AI & Computing Encyclopedia contributors" }]
keywords = ["ai", "encyclopedia", "knowledge-graph", "documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
]
dependencies = ["PyYAML>=6.0.1", "jsonschema>=4.21.0"]

[project.optional-dependencies]
site = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
enc = "encyclopedia.cli:main"

[project.urls]
Homepage = "https://OWNER.github.io/ai-computing-encyclopedia"
Source = "https://github.com/OWNER/ai-computing-encyclopedia"
Issues = "https://github.com/OWNER/ai-computing-encyclopedia/issues"

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# `encyclopedia` lives under tools/, so ruff cannot infer that it is ours.
# Without this it sorts our imports into the third-party group and the
# stdlib / third-party / first-party layout in every file looks "unsorted".
known-first-party = ["encyclopedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
